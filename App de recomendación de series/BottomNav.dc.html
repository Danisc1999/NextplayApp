<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;padding:8px 6px 30px;border-top:1px solid rgba(255,255,255,0.07);background:#0C0C10">
  <div onClick="{{ goHome }}" style="flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:{{ homeColor }}">
    <div style="width:16px;height:16px;border-radius:4px;background:{{ homeColor }}"></div>
    <div style="font-size:10px;font-weight:600">Inicio</div>
  </div>
  <div onClick="{{ goList }}" style="flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:{{ listColor }}">
    <div style="width:16px;height:12px;border:2px solid {{ listColor }};border-radius:2px"></div>
    <div style="font-size:10px;font-weight:600">Mi lista</div>
  </div>
  <div onClick="{{ goRatings }}" style="flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:{{ ratingsColor }}">
    <div style="width:16px;height:16px;border-radius:50%;border:2px solid {{ ratingsColor }}"></div>
    <div style="font-size:10px;font-weight:600">Valoraciones</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;list&quot;,&quot;ratings&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;goHome&quot;:{&quot;editor&quot;:null},&quot;goList&quot;:{&quot;editor&quot;:null},&quot;goRatings&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const inactive = '#6E6C76', activeC = '#FF5A2D';
    return {
      goHome: this.props.goHome, goList: this.props.goList, goRatings: this.props.goRatings,
      homeColor: active === 'home' ? activeC : inactive,
      listColor: active === 'list' ? activeC : inactive,
      ratingsColor: active === 'ratings' ? activeC : inactive
    };
  }
}

</script>
</body>
</html>
